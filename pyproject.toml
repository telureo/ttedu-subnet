[project]
name = "edu-subnet"
version = "0.3.0"
description = "TTedu, Bittensor subnet 35: the incentive rules, the data formats, and the ttedu command line for agencies (miners) and validators."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Telureo" }]
keywords = ["bittensor", "subnet", "ttedu", "telureo", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
dependencies = [
  "bittensor>=11.3,<12",
  "bittensor-wallet>=4.1,<5",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://subnet.telureo.com"
Documentation = "https://docs.telureo.com"
Repository = "https://github.com/telureo/ttedu-subnet"
Issues = "https://github.com/telureo/ttedu-subnet/issues"
Changelog = "https://github.com/telureo/ttedu-subnet/blob/main/CHANGELOG.md"

[project.scripts]
ttedu = "edu_subnet.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
